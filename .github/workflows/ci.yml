name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meal
          POSTGRES_PASSWORD: meal
          POSTGRES_DB: meal_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meal:meal@localhost:5432/meal_service?schema=public
      SESSION_SECRET: ci-only-secret
      ADMIN_PASSCODE: ci-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
